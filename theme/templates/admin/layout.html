{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    {% tailwind_css %}
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  </head>

  <body class="bg-gray-50 text-black font-serif leading-normal tracking-normal">
    <nav
      class="fixed top-0 z-50 w-full nav-bg border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
      <div class="px-3 py-3 lg:px-5 lg:pl-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center justify-start rtl:justify-end">
            <button
              data-drawer-target="logo-sidebar"
              data-drawer-toggle="logo-sidebar"
              aria-controls="logo-sidebar"
              type="button"
              class="inline-flex items-center p-2 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
              <span class="sr-only">Open sidebar</span>
              <svg
                class="w-6 h-6"
                aria-hidden="true"
                fill="currentColor"
                viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  clip-rule="evenodd"
                  fill-rule="evenodd"
                  d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
              </svg>
            </button>
            <a href="/{{ request.session.url }}" class="flex ms-2 md:me-24">
              <img
                src="{% static 'assets/images/logo.png' %}"
                class="h-12 w-36 me-3"
                alt="FlowBite Logo" />
            </a>
          </div>
          <div class="flex items-center">
            <div class="flex items-center ms-3">
              <div>
                <button
                  type="button"
                  class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
                  aria-expanded="false"
                  data-dropdown-toggle="dropdown-user">
                  <span class="sr-only">Open user menu</span>
                  <img
                    class="w-8 h-8 rounded-full"
                    src="{{ user.profile.photo.url }}"
                    alt="user photo" />
                </button>
              </div>
              <div
                class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-sm shadow-sm dark:bg-gray-700 dark:divide-gray-600"
                id="dropdown-user">
                <div class="px-4 py-3" role="none">
                  <p class="text-sm text-gray-900 dark:text-white" role="none">
                    {{ user.username}}
                  </p>
                  <p
                    class="text-sm font-medium text-gray-900 truncate dark:text-gray-300"
                    role="none">
                    {{ user.email }}
                  </p>
                </div>
                <ul class="py-1" role="none">
                  <li>
                    <a
                      href="{% url 'edit-profil' user.id %}"
                      class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
                      role="menuitem"
                      >Edit Profil</a
                    >
                  </li>
                  <li>
                    <a
                      href="/change-password"
                      class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
                      role="menuitem"
                      >Ganti Password</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <aside
      id="logo-sidebar"
      class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform -translate-x-full bg-white border-r border-gray-200 sm:translate-x-0 dark:bg-gray-800 dark:border-gray-700"
      aria-label="Sidebar">
      <div class="h-full px-3 pb-4 overflow-y-auto bg-white dark:bg-gray-800">
        <ul class="space-y-2 font-medium">
          <li>
            <a
              href="/admin-jangga"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg
                class="w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="currentColor"
                viewBox="0 0 22 21">
                <path
                  d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z" />
                <path
                  d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z" />
              </svg>
              <span class="ms-3">Dashboard</span>
            </a>
          </li>
          <li>
            <a
              href="/admin-jangga/daily-report"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 50 50"
                style="fill: #6a7282">
                <path
                  d="M25,2C12.317,2,2,12.317,2,25s10.317,23,23,23s23-10.317,23-23S37.683,2,25,2z M37,26H26v11h-2V26H13v-2h11V13h2v11h11V26z"></path>
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Report Harian</span>
            </a>
          </li>
          <li>
            <a
              href="/admin-jangga/mapping-report"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 50 50"
                style="fill: #6a7282">
                <path
                  d="M25,2C12.317,2,2,12.317,2,25s10.317,23,23,23s23-10.317,23-23S37.683,2,25,2z M37,26H26v11h-2V26H13v-2h11V13h2v11h11V26z"></path>
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Mapping</span>
            </a>
          </li>
          <li>
            <a
              href="/admin-jangga/penagihan"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg 
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white" 
                xmlns="http://www.w3.org/2000/svg" 
                x="0px" 
                y="0px" 
                viewBox="0 0 24 24">
                <path d="M4,19V5c0-1.657,1.343-3,3-3h7l6,6v11c0,1.657-1.343,3-3,3H7C5.343,22,4,20.657,4,19z" opacity=".35"></path><path d="M14,6V2l6,6h-4C14.895,8,14,7.105,14,6z"></path><path d="M15,13H9c-0.553,0-1-0.448-1-1s0.447-1,1-1h6c0.553,0,1,0.448,1,1S15.553,13,15,13z"></path><path d="M13,17H9c-0.553,0-1-0.448-1-1s0.447-1,1-1h4c0.553,0,1,0.448,1,1S13.553,17,13,17z"></path>
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Penagihan</span>
            </a>
          </li>
          <li>
            <a
              href="/admin-jangga/kurvas"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg 
                version="1.1" 
                id="Layer_1" 
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"                 
                xmlns="http://www.w3.org/2000/svg" 
                x="0" 
                y="0" 
                viewBox="0 0 256 256" 
                xml:space="preserve"><style>.st0{fill:#3a312a}</style>
                <path d="m228.209 85.026-53-10a1.505 1.505 0 0 0-1.692.973l-32.934 92.988-57.364-96.255a1.499 1.499 0 0 0-2.682.217l-53.556 135.5a1.498 1.498 0 0 0 1.395 2.052c.597 0 1.162-.36 1.395-.949L82.204 76.889l57.438 96.379a1.5 1.5 0 0 0 2.703-.267l33.57-94.789 51.737 9.762a1.5 1.5 0 1 0 .557-2.948z" style="fill:#8ac6dd"/><path d="M229.106 118.487a1.5 1.5 0 0 0-2.119-.094l-48.357 44.274-44.567-24.482a1.5 1.5 0 0 0-1.812.283L86.672 186.58l-56.95-35.355a1.5 1.5 0 0 0-1.582 2.548l57.989 36a1.503 1.503 0 0 0 1.88-.242l45.624-48.16 44.494 24.442a1.502 1.502 0 0 0 1.735-.208l49.15-45a1.497 1.497 0 0 0 .094-2.118z" style="fill:#ef6d7a"/><path class="st0" d="M239.375 226.625h-209.5v-210.5a1.5 1.5 0 1 0-3 0v212a1.5 1.5 0 0 0 1.5 1.5h211a1.5 1.5 0 1 0 0-3z"/><path class="st0" d="M28.375 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM61.845 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM95.305 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM128.775 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM162.235 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM195.705 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5zM229.165 226.625a1.5 1.5 0 0 0-1.5 1.5v11.75a1.5 1.5 0 1 0 3 0v-11.75a1.5 1.5 0 0 0-1.5-1.5z"/><path class="st0" d="M28.375 226.625h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 193.155h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 159.695h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 126.225h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 92.765h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 59.295h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3zM28.375 25.835h-11.75a1.5 1.5 0 1 0 0 3h11.75a1.5 1.5 0 1 0 0-3z"/>
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Kurva S</span>
            </a>
          </li>
          <li>
            <a
              href="/admin-jangga/projek-db"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="currentColor"
                viewBox="0 0 20 20">
                <path
                  d="m17.418 3.623-.018-.008a6.713 6.713 0 0 0-2.4-.569V2h1a1 1 0 1 0 0-2h-2a1 1 0 0 0-1 1v2H9.89A6.977 6.977 0 0 1 12 8v5h-2V8A5 5 0 1 0 0 8v6a1 1 0 0 0 1 1h8v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-4h6a1 1 0 0 0 1-1V8a5 5 0 0 0-2.582-4.377ZM6 12H4a1 1 0 0 1 0-2h2a1 1 0 0 1 0 2Z" />
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Database Projek</span>
            </a>
          </li>
          <li>
            <a
              href="/logout"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white lucide lucide-log-out-icon lucide-log-out">
                <path d="m16 17 5-5-5-5" />
                <path d="M21 12H9" />
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              </svg>
              <span class="flex-1 ms-3 whitespace-nowrap">Sign Out</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <div class="p-4 sm:ml-64 mt-14 bg-white">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
